services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gestionespaces-db
    environment:
      ACCEPT_EULA: "Y"
      # Dev-only password, never used outside localhost. Override it via a
      # local .env file (SA_PASSWORD=...) if you want a different one.
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-GestionEspaces_Dev2026!}
    ports:
      - "1433:1433"
    volumes:
      - gestionespaces-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  gestionespaces-db-data:
